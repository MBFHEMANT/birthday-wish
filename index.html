<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You — A Little Birthday Story</title>

    <meta name="description" content="A little birthday story made especially for you.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="birthday-page">

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="loader-content">
            <div class="loader-ring"></div>
            <p>Something special is waiting...</p>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="ambient-background">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
        <div class="ambient-glow glow-three"></div>
    </div>

    <div id="particles"></div>

    <!-- MAIN EXPERIENCE -->
    <main class="birthday-main">

        <!-- INTRO -->
        <section id="introSection" class="birthday-section active-section">

            <div class="intro-content">

                <div class="intro-eyebrow reveal">
                    A little something for you
                </div>

                <h1 class="intro-title reveal-delay">
                    Tonight isn't<br>
                    just another night<span>.</span>
                </h1>

                <p class="intro-subtitle reveal-delay-2">
                    It's a day worth celebrating.
                </p>

                <!-- BIRTHDAY PHOTO -->
                <div class="birthday-photo-wrapper reveal-delay-3">
                    <div class="photo-frame">
                        <img
                            src="assets/photos/birthday/birthday.jpg"
                            alt="Birthday girl"
                            class="birthday-photo"
                        >
                    </div>

                    <div class="photo-glow"></div>
                </div>

                <!-- CAKE -->
                <div class="cake-area reveal-delay-4">

                    <div class="cake">

                        <div class="candle candle-one">
                            <div class="flame"></div>
                        </div>

                        <div class="candle candle-two">
                            <div class="flame"></div>
                        </div>

                        <div class="candle candle-three">
                            <div class="flame"></div>
                        </div>

                        <div class="cake-top"></div>

                        <div class="cake-middle"></div>

                        <div class="cake-bottom"></div>

                        <div class="cake-decoration decoration-one"></div>
                        <div class="cake-decoration decoration-two"></div>
                        <div class="cake-decoration decoration-three"></div>

                    </div>

                    <div class="cake-shadow"></div>

                </div>

                <p id="wishText" class="wish-text">
                    Make a wish.
                </p>

                <button id="blowButton" class="primary-button">
                    <span class="button-icon">✦</span>
                    Blow the candles
                </button>

            </div>

        </section>


        <!-- CELEBRATION OVERLAY -->
        <div id="celebrationOverlay" class="celebration-overlay">

            <div class="celebration-content">

                <div class="celebration-small">
                    And just like that...
                </div>

                <h2>
                    Happy Birthday<span>.</span>
                </h2>

                <p>
                    Some people deserve more than just a wish.
                </p>

                <div class="celebration-line"></div>

                <small>
                    And this is only the beginning...
                </small>

            </div>

        </div>


    </main>


    <!-- DEVELOPER BADGE -->
    <button
        id="developerBadge"
        class="developer-badge"
        aria-label="Website developer information"
    >
        <span class="developer-star">✦</span>
        <span class="developer-badge-text">HMT</span>
    </button>


    <!-- AUDIO -->
    <audio id="introMusic" preload="auto">
        <source src="assets/music/intro.mp3" type="audio/mpeg">
    </audio>

    <audio id="birthdayMusic" preload="auto">
        <source src="assets/music/birthday.mp3" type="audio/mpeg">
    </audio>


    <!-- SCRIPTS -->
    <script src="js/music.js"></script>
    <script src="js/main.js"></script>
    <script src="js/birthday.js"></script>
    <script src="js/developer.js"></script>

</body>
</html>
