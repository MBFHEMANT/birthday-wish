<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memories — For You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="inner-page memories-page">

    <div class="ambient-background">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
    </div>

    <div id="particles"></div>


    <!-- PAGE HEADER -->

    <header class="story-header">

        <div class="chapter-number">
            02 / 05
        </div>

        <div class="story-progress">
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot"></span>
            <span class="progress-line"></span>
            <span class="progress-dot"></span>
            <span class="progress-line"></span>
            <span class="progress-dot"></span>
        </div>

    </header>


    <main class="story-page">

        <section class="memory-intro reveal">

            <span class="section-label">
                CHAPTER TWO
            </span>

            <h1>
                Some moments<br>
                become memories.
            </h1>

            <p>
                And some memories become a little harder to forget.
            </p>

        </section>


        <!-- MEMORY 01 -->

        <section class="memory-card memory-card-large">

            <div class="memory-image-wrapper">

                <img
                    src="../assets/photos/couple/couple-01.jpg"
                    alt="A special memory"
                    loading="lazy"
                >

            </div>

            <div class="memory-caption">

                <span>01</span>

                <h2>
                    A moment worth keeping.
                </h2>

            </div>

        </section>


        <!-- MEMORY 02 -->

        <section class="memory-card memory-card-offset">

            <div class="memory-image-wrapper">

                <img
                    src="../assets/photos/couple/couple-02.jpg"
                    alt="A special memory"
                    loading="lazy"
                >

            </div>

            <div class="memory-caption">

                <span>02</span>

                <h2>
                    One of those memories that stays.
                </h2>

            </div>

        </section>


        <!-- MEMORY 03 -->

        <section class="memory-card memory-card-large">

            <div class="memory-image-wrapper">

                <img
                    src="../assets/photos/couple/couple-03.jpg"
                    alt="A special memory"
                    loading="lazy"
                >

            </div>

            <div class="memory-caption">

                <span>03</span>

                <h2>
                    Some moments don't need an explanation.
                </h2>

            </div>

        </section>


        <!-- END -->

        <section class="memory-ending">

            <div class="ending-line"></div>

            <p>
                And somehow, there are already so many memories to look back at.
            </p>

            <a
                href="journey.html"
                class="primary-button link-button"
            >
                Keep going
                <span>→</span>
            </a>

        </section>

    </main>


    <!-- DEVELOPER BADGE -->

    <button
        id="developerBadge"
        class="developer-badge"
        aria-label="Website developer information"
    >
        <span class="developer-star">✦</span>
        <span class="developer-badge-text">HMT</span>
    </button>


    <audio id="memoriesMusic" loop preload="auto">
        <source src="../assets/music/memories.mp3" type="audio/mpeg">
    </audio>


    <script src="../js/music.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/memories.js"></script>
    <script src="../js/developer.js"></script>

</body>
</html>
