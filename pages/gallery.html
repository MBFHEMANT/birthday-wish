<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Gift — For You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="inner-page gallery-page">

    <div class="ambient-background">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
    </div>

    <div id="particles"></div>


    <header class="story-header">

        <div class="chapter-number">
            04 / 05
        </div>

        <div class="story-progress">
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot"></span>
        </div>

    </header>


    <main class="gallery-container">

        <section class="gallery-intro reveal">

            <span class="section-label">
                CHAPTER FOUR
            </span>

            <h1>
                A Little Gift
            </h1>

            <p>
                Because apparently, one picture was never going to be enough.
            </p>

        </section>


        <!-- GALLERY -->

        <section
            id="photoGallery"
            class="photo-gallery"
        >
            <!-- JavaScript generates photos here -->
        </section>


        <!-- LIGHTBOX -->

        <div
            id="lightbox"
            class="lightbox"
            aria-hidden="true"
        >

            <button
                id="lightboxClose"
                class="lightbox-close"
                aria-label="Close image"
            >
                ×
            </button>

            <button
                id="lightboxPrev"
                class="lightbox-navigation lightbox-prev"
                aria-label="Previous image"
            >
                ←
            </button>

            <div class="lightbox-image-container">

                <img
                    id="lightboxImage"
                    src=""
                    alt="Gallery image"
                >

                <div
                    id="lightboxCounter"
                    class="lightbox-counter"
                >
                    01 / 01
                </div>

            </div>

            <button
                id="lightboxNext"
                class="lightbox-navigation lightbox-next"
                aria-label="Next image"
            >
                →
            </button>

        </div>


        <section class="gallery-ending">

            <div class="ending-line"></div>

            <p>
                And that's only a small part of the story.
            </p>

            <a
                href="final.html"
                class="primary-button link-button"
            >
                One last thing
                <span>→</span>
            </a>

        </section>

    </main>


    <button
        id="developerBadge"
        class="developer-badge"
        aria-label="Website developer information"
    >
        <span class="developer-star">✦</span>
        <span class="developer-badge-text">HMT</span>
    </button>


    <script src="../js/music.js"></script>
<script src="../js/main.js"></script>
<script src="../js/gallery.js"></script>
<script src="../js/developer.js"></script>

</body>
</html>
