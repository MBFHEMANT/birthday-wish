<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Last Thing — For You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="inner-page final-page">

    <div class="ambient-background">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
    </div>

    <div id="particles"></div>


    <header class="story-header">

        <div class="chapter-number">
            05 / 05
        </div>

        <div class="story-progress">
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
            <span class="progress-line"></span>
            <span class="progress-dot active"></span>
        </div>

    </header>


    <main class="final-container">

        <section class="final-message">

            <span class="section-label final-label">
                ONE LAST THING
            </span>

            <div class="final-text">

                <p class="final-line line-one">
                    Before you leave...
                </p>

                <p class="final-line line-two">
                    I could have written a hundred things here.
                </p>

                <p class="final-line line-three">
                    But some things are better left between the lines.
                </p>

                <p class="final-line line-four">
                    So for now...
                </p>

                <h1 class="final-birthday">
                    Happy Birthday<span>.</span>
                </h1>

                <p class="final-wish">
                    Keep smiling.<br>
                    Keep growing.<br>
                    Keep being you.
                </p>

                <p class="final-last-line">
                    May this year give you countless reasons to smile.
                </p>

            </div>


            <a
                href="../index.html"
                class="primary-button replay-button"
            >
                <span>↻</span>
                Replay the story
            </a>

        </section>

    </main>


    <button
        id="developerBadge"
        class="developer-badge"
        aria-label="Website developer information"
    >
        <span class="developer-star">✦</span>
        <span class="developer-badge-text">HMT</span>
    </button>


    <script src="../js/main.js"></script>
    <script src="../js/developer.js"></script>

</body>
</html>
